<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ミライのメニュー｜Trattoria Luce</title>
<style>
  :root { --ink:#111; --sub:#666; --blue:#3b82f6; --bg:#f6f6f6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:460px; margin:0 auto; padding:32px 16px; }
  .logo { text-align:center; font-size:32px; letter-spacing:6px; }
  h1 { text-align:center; margin:8px 0 4px; font-size:26px; }
  .tagline { text-align:center; color:var(--sub); margin:0; font-size:14px; }
  .shop { text-align:center; color:var(--sub); margin:2px 0 20px; font-size:14px; }
  .card { background:#fff; border-radius:16px; padding:16px; margin-bottom:16px; }
  .label { font-size:13px; color:#555; margin-bottom:10px; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .size { padding:14px 0; border:1px solid #ddd; border-radius:12px; background:#fff; color:var(--blue); font-size:17px; font-weight:600; }
  .size.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .primary { width:100%; margin-top:14px; padding:16px; border:0; border-radius:999px; background:var(--ink); color:#fff; font-size:17px; font-weight:700; }
  .hint { text-align:center; font-size:12px; color:var(--sub); margin:8px 0 0; }
  .row { display:flex; gap:8px; }
  .row input { flex:1; min-width:0; font-size:24px; letter-spacing:10px; text-align:center; padding:12px; border:1px solid #ddd; border-radius:12px; }
  .row button { flex:0 0 64px; border:0; border-radius:999px; background:var(--ink); color:#fff; font-weight:700; }
  .msg { text-align:center; color:#c00; min-height:1em; }
</style>
</head>
<body>
<main>
  <div class="logo">🟣🟤🔵🩵</div>
  <h1>ミライのメニュー</h1>
  <p class="tagline">言い出さなくても、ボットがわかってくれる。</p>
  <p class="shop">Trattoria Luce</p>

  <section class="card">
    <div class="label">何名様ですか？</div>
    <div class="grid" id="sizes"></div>
    <button class="primary" id="create">テーブルを作る</button>
    <p class="hint">4桁のテーブル番号ができます。一緒に来た人に伝えてください</p>
  </section>

  <section class="card">
    <div class="label">テーブル番号で参加</div>
    <div class="row">
      <input id="code" inputmode="numeric" maxlength="4" placeholder="1234" pattern="\d{4}">
      <button id="join">参加</button>
    </div>
  </section>
  <p class="msg" id="msg"></p>
</main>
<script>
  let size = 2;
  const sizes = document.getElementById("sizes");
  for (let n = 1; n <= 8; n++) {
    const b = document.createElement("button");
    b.className = "size" + (n === size ? " on" : "");
    b.textContent = n + "名";
    b.onclick = () => { size = n; [...sizes.children].forEach((x, i) => x.classList.toggle("on", i + 1 === n)); };
    sizes.appendChild(b);
  }
  const msg = (t) => (document.getElementById("msg").textContent = t);

  document.getElementById("create").onclick = async () => {
    const r = await fetch("/api/tables", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ size }) });
    const d = await r.json();
    if (!d.ok) return msg(d.error);
    // botToken は「この端末だけ」に保存（フェーズ7で幹事ボットに秘密として渡す）
    sessionStorage.setItem("botToken:" + d.code, d.botToken);
    location.href = "/t/" + d.code;
  };
  document.getElementById("join").onclick = () => {
    const c = document.getElementById("code").value.trim();
    if (!/^\d{4}$/.test(c)) return msg("4桁の番号を入れてください");
    location.href = "/t/" + c;
  };
</script>
</body>
</html>
